name: Tests
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Callable from the release workflows so a tag cannot ship without
  # this having passed on the same commit. `needs:` only reaches across
  # jobs within one workflow, so gating a release on Tests means Tests
  # has to run as a job inside it.
  workflow_call:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries
        # PySide6 ships its own Qt, but libQt6Gui hard-links these system
        # libraries (even under QT_QPA_PLATFORM=offscreen). The runner
        # image doesn't carry them, so without this step importing
        # PySide6 dies with "libEGL.so.1: cannot open shared object file"
        # inside the pytest-qt plugin load — surfacing as a bare
        # INTERNALERROR / exit code 3.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install carton-maya + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Qt platform plugin (offscreen)
        run: |
          # QT_QPA_PLATFORM=offscreen is set by tests/conftest.py.
          python -m pip install PySide6

      - name: Sanity-check Qt loads headless
        # Fails with the real ImportError when a system lib is missing,
        # instead of letting pytest choke on it as an internal error.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6 import QtWidgets; QtWidgets.QApplication([]); print('qt ok')"

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v

  runtime-floor:
    name: pytest (Maya's interpreter floor, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maya 2023 runs Python 3.9 and Maya 2022 runs 3.7. The installer
        # accepts any Python 3, so the suite has to keep working below the
        # 3.10 floor that `pyproject.toml` declares for the pip-installed
        # CLI. Carton is not installed here on purpose - `pip install -e .`
        # would refuse these versions, and inside Maya nothing pip-installs
        # it either; the tests import it from the checkout, exactly as Maya
        # imports it from the deployed directory.
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies only
        run: python -m pip install pytest jsonschema questionary

      - name: Run pytest
        # No Qt binding on this interpreter, so the widget tests skip
        # themselves. Everything else is the code Maya 2022 / 2023 run.
        run: python -m pytest tests/ -q
